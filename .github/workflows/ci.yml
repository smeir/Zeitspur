name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: make deps

      - name: Lint
        run: make lint

      - name: Ensure formatting produced no changes
        run: git diff --exit-code

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Race test
        run: go test -race ./...
