# Zeitspur example configuration file.
# Copy to ~/.config/zeitspur/config.toml and adjust as needed.

[activity]
mode = "idle_and_lock" # "idle_and_lock" or "lock_only". Suspend always counts as a pause.
poll_interval = "5s"
idle_threshold = "5m"

[server]
listen_address = "127.0.0.1:8787"

[app]
timezone = "local" # "local" or a valid IANA timezone such as "Europe/Berlin"
language = "de"    # "de" or "en"
today_weekdays = ["mon", "tue", "wed", "thu", "fri"] # Days shown in the Today view week chart.
