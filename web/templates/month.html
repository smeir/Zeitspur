{{ define "content" }}
<div class="card">
  <div class="card-head">
    <h2>{{ monthYear .Month }}</h2>
    <div class="card-actions">
      <a class="btn secondary" href="/month?date={{ .PrevMonth.Format "2006-01-02" }}">{{ T "Previous" }}</a>
      <a class="btn secondary" href="/month?date={{ .NextMonth.Format "2006-01-02" }}">{{ T "Next" }}</a>
    </div>
  </div>
  <div class="calendar">
    {{ range .Cells }}
      {{ if .Empty }}
        <div class="day empty"></div>
      {{ else }}
        <a href="/day/{{ .Date }}" class="day" style="text-decoration:none;color:inherit;">
          <div class="date">{{ .DayNum }}</div>
          {{ if .HasWork }}
            <div class="bar" style="width: {{ .BarWidth }}%;"></div>
            <div class="minutes">{{ formatMinutes .WorkedMinutes }}</div>
          {{ end }}
          {{ if .Booked }}<span class="booked">B</span>{{ end }}
          </a>
          {{ end }}
          {{ end }}
  </div>
</div>
{{ end }}
