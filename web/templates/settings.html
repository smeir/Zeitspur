{{ define "content" }}
<div class="card">
  <h2>{{ T "Settings" }}</h2>
  <form action="/settings" method="post">
    <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
    <label>{{ T "ActivityMode" }}
      <select name="activity_mode">
        <option value="idle_and_lock" {{ if eq .Config.Activity.Mode "idle_and_lock" }}selected{{ end }}>{{ T "ActivityModeIdleAndLock" }}</option>
        <option value="lock_only" {{ if eq .Config.Activity.Mode "lock_only" }}selected{{ end }}>{{ T "ActivityModeLockOnly" }}</option>
      </select>
    </label>
    <label>{{ T "PollInterval" }} <input type="text" name="poll_interval" value="{{ .Config.Activity.PollInterval }}"></label>
    <label>{{ T "IdleThreshold" }} <input type="text" name="idle_threshold" value="{{ .Config.Activity.IdleThreshold }}"></label>
    <p class="muted">{{ T "IdleThresholdModeNote" }}</p>
    <label>{{ T "ListenAddress" }} <input type="text" name="listen_address" value="{{ .Config.Server.ListenAddress }}"></label>
    <label>{{ T "Timezone" }}
      <select name="timezone">
        <option value="local" {{ if eq .Config.App.Timezone "local" }}selected{{ end }}>{{ T "UseSystemTimezone" }}</option>
        {{ range .Timezones }}
          <option value="{{ . }}" {{ if eq . $.Config.App.Timezone }}selected{{ end }}>{{ . }}</option>
        {{ end }}
      </select>
    </label>
    <label>{{ T "Language" }}
      <select name="language">
        {{ range .Languages }}
          <option value="{{ . }}" {{ if eq . $.Config.App.Language }}selected{{ end }}>{{ .NativeName }}</option>
        {{ end }}
      </select>
    </label>
    <fieldset class="weekday-settings">
      <legend>{{ T "TodayWeekdays" }}</legend>
      <div class="weekday-options">
      {{ range .Weekdays }}
        <label><input type="checkbox" name="today_weekdays" value="{{ .Value }}" {{ if .Selected }}checked{{ end }}> {{ .Label }}</label>
      {{ end }}
      </div>
    </fieldset>
    <button type="submit">{{ T "Save" }}</button>
  </form>
  <p class="muted">{{ Tf "SettingsPersisted" (dict "Path" .ConfigPath) }}</p>
  <p class="muted">{{ T "Version" }} {{ .Version }}</p>
</div>
{{ end }}
